      /* KEY FIX: Lock the viewport completely. */
      html {
        height: 100%;

        overflow: hidden;

        position: fixed; /* Nuclear option: Pins body to viewport */

      }

      }
      
      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent; 
      }
      ::-webkit-scrollbar-thumb {
        background: #334155; 
        border-radius: 3px;
      }

        background: #475569;
